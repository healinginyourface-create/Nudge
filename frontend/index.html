<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nudge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="backButton" class="back-button" type="button" aria-label="Go back">← Back</button>

<div class="app-shell" id="app">

  <!-- HOME -->
  <section class="screen active" id="homePage">
    <header class="topbar">
      <div class="brand">NUDGE<span>.</span></div>
      <div class="streak"><i></i> 3 DAY</div>
    </header>

    <div class="filters">
      <button class="filter-btn" data-filter="who">
        <span>WHO?</span><strong id="whoLabel">ALL</strong>
      </button>
      <button class="filter-btn" data-filter="where">
        <span>WHERE?</span><strong id="whereLabel">ALL</strong>
      </button>
      <button class="filter-btn" data-filter="mood">
        <span>MOOD?</span><strong id="moodLabel">ALL</strong>
      </button>
    </div>

    <main class="home-main">
      <div class="headline">
        <p class="eyebrow">TODAY'S NUDGE</p>
        <h1>What are you<br><em>up to?</em></h1>
        <p>One small nudge is enough to change your day.</p>
      </div>

      <div class="card-stack">
        <div class="card-shadow shadow-two"></div>
        <div class="card-shadow shadow-one"></div>
        <article class="nudge-card" id="nudgeCard">
          <div class="loader">
            <div class="spinner"></div>
            <span>Finding your nudge...</span>
          </div>
        </article>
      </div>

      <div class="swipe-hint">
        <span>← SKIP</span>
        <span>SAVE →</span>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home"><b>⌂</b><span>HOME</span></button>
      <button class="nav-btn" data-page="social"><b>◎</b><span>SOCIAL</span></button>
      <button class="nav-btn" data-page="my"><b>○</b><span>MY</span></button>
    </nav>
  </section>

  <!-- FILTER SHEET -->
  <section class="filter-overlay hidden" id="filterOverlay">
    <div class="filter-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <p class="eyebrow">FILTER</p>
          <h2 id="filterTitle">WHO?</h2>
        </div>
        <button class="close-btn" id="closeFilter">×</button>
      </div>
      <div class="filter-options" id="filterOptions"></div>
    </div>
  </section>

  <!-- MISSION -->
  <section class="screen mission-screen" id="missionPage">
    <button class="mission-close" id="closeMission">×</button>
    <div id="missionContent"></div>
  </section>

  <!-- SOCIAL -->
  <section class="screen page-screen" id="socialPage">
    <header class="page-header">
      <div><p class="eyebrow">YOUR PEOPLE</p><h2>Social</h2></div>
      <div class="profile-mini">H</div>
    </header>

    <div class="social-stats">
      <div><strong>12</strong><span>FRIENDS</span></div>
      <div><strong>68%</strong><span>COLLECTED</span></div>
      <div><strong>07</strong><span>TITLES</span></div>
    </div>

    <p class="section-label">FRIENDS</p>
    <div class="friends-list" id="friendsList"></div>
  </section>

  <!-- MY -->
  <section class="screen page-screen" id="myPage">
    <header class="page-header">
      <div><p class="eyebrow">ABOUT YOU</p><h2>My</h2></div>
      <div class="profile-mini">H</div>
    </header>

    <div class="profile-card">
      <div class="avatar">H</div>
      <div class="profile-copy">
        <h3>Hyun</h3>
        <p>DAY EXPLORER</p>
      </div>
      <div class="collection-stat">
        <strong>68%</strong><span>COLLECTED</span>
      </div>
    </div>

    <div class="my-menu">
      <button class="menu-row" data-panel="saved">
        <span class="menu-icon">♡</span>
        <span><strong>Saved</strong><small>Your saved nudges</small></span>
        <i>›</i>
      </button>
      <button class="menu-row" data-panel="collection">
        <span class="menu-icon">◇</span>
        <span><strong>Collection</strong><small>Activities you've completed</small></span>
        <i>›</i>
      </button>
      <button class="menu-row" data-panel="titles">
        <span class="menu-icon">✦</span>
        <span><strong>Titles</strong><small>Equip your achievement</small></span>
        <i>›</i>
      </button>
      <button class="menu-row" data-panel="theme">
        <span class="menu-icon">◐</span>
        <span><strong>Theme</strong><small>Change your Nudge look</small></span>
        <i>›</i>
      </button>
    </div>

    <div class="inline-panel hidden" id="myPanel"></div>
  </section>

  <!-- SAVED -->
  <section class="screen page-screen" id="savedPage">
    <header class="page-header">
      <div><p class="eyebrow">YOUR PICKS</p><h2>Saved</h2></div>
    </header>
    <div class="saved-list" id="savedList"></div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
