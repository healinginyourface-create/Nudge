<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nudge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header class="header">

        <div class="logo">
            NUDGE
        </div>

    </header>


    <!-- ========================= -->
    <!-- Filters -->
    <!-- ========================= -->

    <section class="filters">

        <button class="filter" id="locationFilter">
            🌍
        </button>

        <button class="filter" id="peopleFilter">
            🧘
        </button>

        <button class="filter" id="categoryFilter">
            🔥
        </button>

        <button class="filter" id="budgetFilter">
            💰
        </button>

    </section>


    <!-- ========================= -->
    <!-- Card Area -->
    <!-- ========================= -->

    <main class="main">

        <div class="card-stack">

            <div class="card-back card-back-2"></div>
            <div class="card-back card-back-1"></div>

            <div id="card" class="card">

                <div class="loading">
                    오늘 뭐 하지?
                </div>

            </div>

        </div>

    </main>


    <!-- ========================= -->
    <!-- Bottom Navigation -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <button
            class="nav-button"
            id="savedButton">

            <span>♡</span>

        </button>


        <button
            class="nav-button active"
            id="homeButton">

            <span>▣</span>

        </button>


        <button
            class="nav-button"
            id="myButton">

            <span>♙</span>

        </button>

    </nav>


    <!-- ========================= -->
    <!-- Filter Modal -->
    <!-- ========================= -->

    <div
        id="filterModal"
        class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    필터
                </h2>

                <button
                    id="closeModal"
                    class="close-button">

                    ×

                </button>

            </div>


            <div
                id="modalOptions"
                class="modal-options">
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Saved Page -->
    <!-- ========================= -->

    <section
        id="savedPage"
        class="page hidden">

        <div class="page-header">

            <h2>Saved</h2>

            <button
                id="closeSaved"
                class="page-close">

                ×

            </button>

        </div>

        <div
            id="savedList"
            class="saved-list">
        </div>

    </section>


    <!-- ========================= -->
    <!-- My Page -->
    <!-- ========================= -->

    <section
        id="myPage"
        class="page hidden">

        <div class="page-header">

            <h2>My</h2>

            <button
                id="closeMy"
                class="page-close">

                ×

            </button>

        </div>


        <div class="my-content">

            <div class="profile">

                <div class="profile-circle">
                    H
                </div>

                <div>
                    <h3>Hyun</h3>
                    <p>Nudge user</p>
                </div>

            </div>


            <div class="my-section">

                <h3>오늘의 취향</h3>

                <div class="my-tags">

                    <span>가벼운 활동</span>
                    <span>서울</span>
                    <span>새로운 경험</span>

                </div>

            </div>

        </div>

    </section>


</div>


<script src="app.js"></script>

</body>
</html>
