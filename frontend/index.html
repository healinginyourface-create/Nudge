<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WannaDo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">
        <h1>WannaDo</h1>
        <p class="subtitle">오늘 뭐 하지?</p>

        <div id="card" class="card">
            <div class="loading">추천을 불러오는 중...</div>
        </div>

        <div class="buttons">
            <button id="dislike" class="button dislike">✕</button>
            <button id="like" class="button like">♥</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
